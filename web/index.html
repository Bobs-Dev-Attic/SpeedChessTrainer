<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Speed Chess Trainer — learn and improve at fast chess against configurable AI personalities and chess legends.">

  <!-- iOS / mobile web app meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Speed Chess Trainer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#769656">

  <title>Speed Chess Trainer</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <script>
    // Capture the PWA install prompt so the app can offer an "Install app"
    // button (see lib/services/install_prompt_web.dart).
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        window.dispatchEvent(new Event('pwa-install-available'));
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
      });
      window.flutterCanInstall = function () { return !!deferred; };
      window.flutterInstallApp = function () {
        if (!deferred) return Promise.resolve(false);
        deferred.prompt();
        return deferred.userChoice.then(function (choice) {
          deferred = null;
          return !!choice && choice.outcome === 'accepted';
        });
      };
    })();

    // Register our own service worker for offline support (Flutter's built-in
    // one no longer caches). Built with --pwa-strategy=none so this is the
    // only service worker.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW registration failed:', e);
        });
      });
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1b1b1f;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e6e1e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading .knight { font-size: 64px; }
    #loading .title { margin-top: 12px; font-size: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="knight">♞</div>
    <div class="title">Speed Chess Trainer</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
